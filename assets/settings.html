<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
  --line: #d2d2d7; --accent: #0071e3; --chip: #e8e8ed;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1e20; --card: #2a2a2d; --text: #f5f5f7; --muted: #98989d;
    --line: #3a3a3d; --accent: #0a84ff; --chip: #3a3a3f;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text);
  font: 13px/1.45 -apple-system, "Helvetica Neue", sans-serif;
  -webkit-user-select: none; height: 100%; overflow: hidden; }
#wrap { display: flex; flex-direction: column; height: 100%; }
header { display: flex; align-items: center; gap: 10px; padding: 14px 18px;
  border-bottom: 1px solid var(--line); cursor: default; }
header h1 { font-size: 15px; font-weight: 600; flex: 1; }
#closeBtn { border: none; background: none; color: var(--muted); font-size: 15px;
  cursor: pointer; padding: 2px 6px; border-radius: 6px; }
#closeBtn:hover { background: var(--chip); }
main { flex: 1; overflow-y: auto; padding: 14px 18px; }
section, details { background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
h2, summary { font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--muted); margin-bottom: 10px; cursor: default; }
summary { cursor: pointer; margin-bottom: 0; }
details[open] summary { margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
.row label:first-child { flex: 1; }
.hint { color: var(--muted); font-size: 11px; }
input[type="text"], input[type="number"] { background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit;
  -webkit-user-select: text; width: 130px; }
input[type="number"] { width: 64px; }
input[type="range"] { flex: 1; accent-color: var(--accent); }
input[type="color"] { border: none; background: none; width: 34px; height: 24px; padding: 0; }
.val { min-width: 58px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.switch { position: relative; width: 36px; height: 21px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch i { position: absolute; inset: 0; background: var(--chip); border-radius: 21px;
  transition: 0.15s; }
.switch i:before { content: ""; position: absolute; width: 17px; height: 17px;
  left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: 0.15s;
  box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
.switch input:checked + i { background: #34c759; }
.switch input:checked + i:before { transform: translateX(15px); }
.tier { font-size: 10px; color: var(--muted); background: var(--chip);
  border-radius: 5px; padding: 1px 6px; flex: none; }
.patterns { padding: 2px 0 8px 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; }
.chip { background: var(--chip); border-radius: 6px; padding: 2px 7px; font-size: 11px;
  display: inline-flex; align-items: center; gap: 5px; }
.chip b { font-weight: 400; }
.chip span { cursor: pointer; color: var(--muted); }
.chip span:hover { color: var(--text); }
.chips input { width: 110px; border: 1px dashed var(--line); background: none; }
#hotkey { width: 90px; text-align: center; cursor: pointer; -webkit-user-select: none; }
#hotkey.rec { border-color: var(--accent); color: var(--accent); }
footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px;
  border-top: 1px solid var(--line); }
button { font: inherit; border-radius: 7px; padding: 6px 16px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--text); }
#saveBtn { background: var(--accent); color: #fff; border-color: var(--accent); }
.model { color: var(--muted); font-size: 11px; -webkit-user-select: text; }
</style>
</head>
<body>
<div id="wrap">
  <header id="dragbar">
    <h1>GhostType Settings</h1>
    <label class="switch" title="GhostType on/off">
      <input type="checkbox" id="enabled"><i></i>
    </label>
    <input type="text" id="hotkey" readonly title="Click, then press the new toggle shortcut">
    <button id="closeBtn" title="Close without saving">✕</button>
  </header>
  <main>
    <section>
      <h2>Typing feel</h2>
      <div class="row"><label>Pause before suggesting</label>
        <input type="range" id="idleMs" min="100" max="600" step="10">
        <span class="val" id="idleMsVal"></span></div>
      <div class="row"><label>Suggestion length</label>
        <input type="range" id="maxTokens" min="4" max="20" step="1">
        <span class="val" id="maxTokensVal"></span></div>
    </section>
    <section>
      <h2>Apps</h2>
      <div id="apps"></div>
    </section>
    <section>
      <h2>Appearance</h2>
      <div class="row"><label>Ghost text color</label>
        <input type="color" id="ghostHex">
        <input type="range" id="ghostAlpha" min="0" max="1" step="0.05" style="width:90px;flex:none">
        <span class="val" id="ghostAlphaVal"></span></div>
      <div class="row"><label>Font size</label>
        <input type="number" id="fontSize" min="8" max="36"></div>
      <div class="row"><label>Font name</label>
        <input type="text" id="fontName"></div>
    </section>
    <details>
      <summary>Advanced</summary>
      <div class="row"><label>Server URL</label>
        <input type="text" id="serverUrl" style="width:200px"></div>
      <div class="row"><label>Min prefix chars <span class="hint">(below this, no request)</span></label>
        <input type="number" id="minPrefixChars" min="1"></div>
      <div class="row"><label>Max prefix chars</label>
        <input type="number" id="maxPrefixChars" min="1"></div>
      <div class="row"><label>Max suffix chars</label>
        <input type="number" id="maxSuffixChars" min="1"></div>
      <div class="row"><label>Request timeout (s)</label>
        <input type="number" id="requestTimeoutSec" min="1" max="10"></div>
      <div class="row"><label>Fallback char width <span class="hint">(Obsidian-style apps)</span></label>
        <input type="number" id="fallbackCharWidth" min="2" max="30"></div>
      <div class="row"><label>Fallback line height</label>
        <input type="number" id="fallbackLineHeight" min="8" max="60"></div>
      <div class="row"><label>Fallback left pad</label>
        <input type="number" id="fallbackLeftPad" min="0" max="50"></div>
      <div class="row"><label>Server model</label>
        <span class="model">__MODEL__</span></div>
    </details>
  </main>
  <footer>
    <button id="cancelBtn">Cancel</button>
    <button id="saveBtn">Save</button>
  </footer>
</div>
<script>
const CFG = JSON.parse("__CFGJSON__");
const BROWSERS = ["Arc", "Google Chrome", "Safari", "Vivaldi"];
const APP_ORDER = ["Notes", "Mail", "Claude", "Arc", "Google Chrome", "Safari",
                   "Vivaldi", "Microsoft Word", "Microsoft PowerPoint", "Obsidian"];
const post = (m) => window.webkit.messageHandlers.ghosttype_settings.postMessage(m);
const $ = (id) => document.getElementById(id);

// ── populate scalar fields ──────────────────────────────────────────────────
$("enabled").checked = CFG.enabled === true;
// Master switch is live: it flips GhostType immediately through the same code
// path as the menubar/⌘⌥G toggle (menubar glyph updates, config saves) — no
// Save click needed, no possibility of drifting out of sync.
$("enabled").addEventListener("change", () => post("setEnabled::" + $("enabled").checked));
for (const k of ["idleMs", "maxTokens", "fontSize", "fontName", "serverUrl",
                 "minPrefixChars", "maxPrefixChars", "maxSuffixChars",
                 "requestTimeoutSec", "fallbackCharWidth", "fallbackLineHeight",
                 "fallbackLeftPad"]) {
  $(k).value = CFG[k];
}
const hex2 = (f) => Math.round((f || 0) * 255).toString(16).padStart(2, "0");
$("ghostHex").value = "#" + hex2(CFG.ghostColor.red) + hex2(CFG.ghostColor.green) + hex2(CFG.ghostColor.blue);
$("ghostAlpha").value = CFG.ghostColor.alpha;
const syncVals = () => {
  $("idleMsVal").textContent = $("idleMs").value + " ms";
  $("maxTokensVal").textContent = "≈ " + Math.round($("maxTokens").value * 0.75) + " words";
  $("ghostAlphaVal").textContent = Math.round($("ghostAlpha").value * 100) + "%";
};
["idleMs", "maxTokens", "ghostAlpha"].forEach((id) => $(id).addEventListener("input", syncVals));
syncVals();

// ── hotkey recorder ─────────────────────────────────────────────────────────
const SYM = { cmd: "⌘", alt: "⌥", ctrl: "⌃", shift: "⇧" };
let hotkey = CFG.toggleHotkey;
const showHotkey = () => {
  $("hotkey").value = (hotkey.mods || []).map((m) => SYM[m] || m).join("") +
                      (hotkey.key || "").toUpperCase();
};
showHotkey();
let recording = false;
$("hotkey").addEventListener("click", () => {
  recording = true; $("hotkey").classList.add("rec");
  $("hotkey").value = "press keys…"; $("hotkey").focus();
});
$("hotkey").addEventListener("blur", () => {
  if (recording) { recording = false; $("hotkey").classList.remove("rec"); showHotkey(); }
});
$("hotkey").addEventListener("keydown", (e) => {
  if (!recording) return;
  e.preventDefault();
  if (e.key === "Escape") { recording = false; $("hotkey").classList.remove("rec"); showHotkey(); $("hotkey").blur(); return; }
  if (["Meta", "Alt", "Control", "Shift"].includes(e.key)) return; // wait for the real key
  const mods = [];
  if (e.metaKey) mods.push("cmd");
  if (e.altKey) mods.push("alt");
  if (e.ctrlKey) mods.push("ctrl");
  if (e.shiftKey) mods.push("shift");
  if (mods.length === 0) return; // bare keys can't be a global toggle
  hotkey = { mods, key: e.key.toLowerCase() };
  recording = false; $("hotkey").classList.remove("rec"); showHotkey(); $("hotkey").blur();
});

// ── apps list ───────────────────────────────────────────────────────────────
const appState = {}; // name -> { enabled, sitePatterns?, titlePatterns? }
const chipsEditor = (state, kind, list, onChange) => {
  const box = document.createElement("div");
  box.className = "chips";
  const render = () => {
    box.innerHTML = "";
    state[kind].forEach((p, i) => {
      const chip = document.createElement("span");
      chip.className = "chip";
      const b = document.createElement("b"); b.textContent = p;
      const x = document.createElement("span"); x.textContent = "×";
      x.onclick = () => { state[kind].splice(i, 1); render(); if (onChange) onChange(); };
      chip.append(b, x); box.appendChild(chip);
    });
    const inp = document.createElement("input");
    inp.placeholder = "add + ⏎";
    inp.onkeydown = (e) => {
      if (e.key === "Enter" && inp.value.trim()) { state[kind].push(inp.value.trim()); render(); if (onChange) onChange(); }
    };
    box.appendChild(inp);
  };
  state[kind] = (list || []).slice();
  render();
  return box;
};
// Honest controls only: Obsidian's ghost text comes from its own CM6 plugin
// (managed in Obsidian → Community plugins; it obeys the master toggle above,
// not this row), so it gets a note instead of a switch that controls the
// deliberately-disabled AX path. Word/PowerPoint stay visible but greyed —
// the AX path behind them is documented as mostly nonfunctional; flipping
// them is a config.json experiment, not a settings-window promise.
const PLUGIN_APPS = { Obsidian: "via Obsidian plugin — manage in Obsidian; obeys the master toggle" };
const EXPERIMENTAL = ["Microsoft Word", "Microsoft PowerPoint"];
for (const name of APP_ORDER) {
  const app = CFG.apps[name];
  if (!app) continue;
  const row = document.createElement("div");
  row.className = "row";
  const label = document.createElement("label"); label.textContent = name;
  const tier = document.createElement("span"); tier.className = "tier"; tier.textContent = "tier " + app.tier;
  row.append(label, tier);
  if (PLUGIN_APPS[name]) {
    const note = document.createElement("span"); note.className = "hint";
    note.textContent = PLUGIN_APPS[name];
    row.appendChild(note);
  } else {
    appState[name] = { enabled: app.enabled === true };
    const sw = document.createElement("label"); sw.className = "switch";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = app.enabled === true;
    if (EXPERIMENTAL.includes(name)) {
      cb.disabled = true;
      sw.style.opacity = "0.4";
      sw.title = "Experimental — the AX path behind this mostly doesn't work; enable in config.json to try anyway";
    } else {
      cb.onchange = () => { appState[name].enabled = cb.checked; };
    }
    sw.appendChild(cb); sw.appendChild(document.createElement("i"));
    row.appendChild(sw);
  }
  $("apps").appendChild(row);
  if (BROWSERS.includes(name)) {
    const pat = document.createElement("div");
    pat.className = "patterns";
    const l1 = document.createElement("div"); l1.className = "hint"; l1.textContent = "Sites (URL contains)";
    const l2 = document.createElement("div"); l2.className = "hint"; l2.textContent = "Title fallback (title contains)";
    pat.append(l1, chipsEditor(appState[name], "sitePatterns", app.sitePatterns),
               l2, chipsEditor(appState[name], "titlePatterns", app.titlePatterns));
    $("apps").appendChild(pat);
  }
}

// ── drag, close, save ───────────────────────────────────────────────────────
let dragging = null;
$("dragbar").addEventListener("mousedown", (e) => {
  if (e.target.closest("input,button,label")) return;
  dragging = { x: e.screenX, y: e.screenY };
});
document.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  const dx = e.screenX - dragging.x, dy = e.screenY - dragging.y;
  if (dx || dy) { post("move::" + dx + "," + dy); dragging = { x: e.screenX, y: e.screenY }; }
});
document.addEventListener("mouseup", () => { dragging = null; });
$("closeBtn").onclick = () => post("close");
$("cancelBtn").onclick = () => post("close");
$("saveBtn").onclick = () => {
  // `enabled` is NOT in the payload — the header switch applies instantly via
  // setEnabled::, and a stale window must never clobber an external toggle.
  const out = {
    toggleHotkey: hotkey,
    ghostHex: $("ghostHex").value,
    ghostAlpha: parseFloat($("ghostAlpha").value),
    fontName: $("fontName").value,
    serverUrl: $("serverUrl").value,
    apps: appState,
  };
  for (const k of ["idleMs", "maxTokens", "fontSize", "minPrefixChars", "maxPrefixChars",
                   "maxSuffixChars", "requestTimeoutSec", "fallbackCharWidth",
                   "fallbackLineHeight", "fallbackLeftPad"]) {
    out[k] = parseFloat($(k).value);
  }
  post("save::" + JSON.stringify(out));
};
</script>
</body>
</html>
